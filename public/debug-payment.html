<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment API Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Payment Verification API Debug</h1>
    
    <div class="debug-section">
        <h2>Test Payment Verification</h2>
        <button onclick="testPayment()">Test Mock Payment</button>
        <div id="results"></div>
    </div>

    <script>
        async function testPayment() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                console.log('Starting payment verification test...');
                
                const response = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderId: 'MOCK_ORDER_12345',
                        bookingId: 'test_booking_123'
                    })
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                console.log('Response headers:', [...response.headers.entries()]);

                const result = await response.json();
                console.log('API Response:', result);
                console.log('Type of result:', typeof result);
                console.log('Result keys:', Object.keys(result));
                
                // Check specific properties
                console.log('result.success:', result.success, typeof result.success);
                console.log('result.paymentStatus:', result.paymentStatus, typeof result.paymentStatus);
                console.log('result.message:', result.message, typeof result.message);

                // Simulate what the callback page does
                if (response.ok) {
                    console.log('✅ Response is OK - this should set paymentResult');
                    resultsDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                        <h4>Response Analysis:</h4>
                        <ul>
                            <li>Status: ${response.status}</li>
                            <li>OK: ${response.ok}</li>
                            <li>Success: ${result.success} (${typeof result.success})</li>
                            <li>Payment Status: ${result.paymentStatus} (${typeof result.paymentStatus})</li>
                            <li>Message: ${result.message}</li>
                        </ul>
                    `;
                } else {
                    console.log('❌ Response not OK - this would set error');
                    resultsDiv.innerHTML = `
                        <h3>❌ Error Response</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }

            } catch (error) {
                console.error('❌ Catch block error:', error);
                resultsDiv.innerHTML = `
                    <h3>❌ Catch Block Error</h3>
                    <p>This is what causes "Failed to verify payment status"</p>
                    <pre>${error.toString()}</pre>
                `;
            }
        }
    </script>
</body>
</html>
