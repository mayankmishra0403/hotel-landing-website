<!DOCTYPE html>
<html>
<head>
    <title>Payment Verification Test</title>
</head>
<body>
    <h1>Payment Verification API Test</h1>
    <button onclick="testVerificationAPI()">Test Mock Payment Verification</button>
    <div id="result"></div>

    <script>
        async function testVerificationAPI() {
            const testData = {
                orderId: "MOCK_HOTEL_test_" + Date.now(),
                bookingId: "test_booking_" + Date.now()
            };

            try {
                console.log('Testing verification API with:', testData);
                
                const response = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                
                const result = await response.json();
                console.log('API Response:', result);
                
                document.getElementById('result').innerHTML = '<pre style="background: #f0f0f0; padding: 10px;">' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
