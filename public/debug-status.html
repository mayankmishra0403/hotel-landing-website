<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Payment Status Debug Test</h1>
    
    <div class="test-section">
        <h2>Test Current Payment Verification</h2>
        <button onclick="testCurrentPayment()">Test Payment Verification</button>
        <div id="current-test-results"></div>
    </div>

    <div class="test-section">
        <h2>PaymentStatus Enum Test</h2>
        <p>Testing how the frontend processes payment status values:</p>
        <button onclick="testPaymentStatusEnum()">Test Status Processing</button>
        <div id="enum-test-results"></div>
    </div>

    <script>
        // Simulate the PaymentStatus enum (same as in the app)
        const PaymentStatus = {
            SUCCESS: 'SUCCESS',
            FAILED: 'FAILED',
            PENDING: 'PENDING',
            CANCELLED: 'CANCELLED',
            USER_DROPPED: 'USER_DROPPED'
        };

        async function testCurrentPayment() {
            const resultsDiv = document.getElementById('current-test-results');
            resultsDiv.innerHTML = '<p>Testing current payment verification...</p>';
            
            try {
                const response = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderId: 'MOCK_DEBUG_TEST_' + Date.now(),
                        bookingId: 'debug_booking_' + Date.now()
                    })
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                const result = await response.json();
                console.log('Full API Response:', result);

                let html = `<div class="result ${response.ok ? 'success' : 'error'}">`;
                html += `<h4>API Response (${response.status})</h4>`;
                html += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                
                if (response.ok && result.paymentStatus) {
                    html += `<h4>Status Analysis:</h4>`;
                    html += `<ul>`;
                    html += `<li>API returned paymentStatus: "${result.paymentStatus}" (type: ${typeof result.paymentStatus})</li>`;
                    html += `<li>PaymentStatus.SUCCESS: "${PaymentStatus.SUCCESS}" (type: ${typeof PaymentStatus.SUCCESS})</li>`;
                    html += `<li>Are they equal? ${result.paymentStatus === PaymentStatus.SUCCESS}</li>`;
                    html += `<li>Strict equality check: ${result.paymentStatus === 'SUCCESS'}</li>`;
                    html += `</ul>`;
                    
                    // Test the status icon logic
                    html += `<h4>UI Status Display Test:</h4>`;
                    const statusDisplay = getStatusDisplay(result.paymentStatus);
                    html += `<p>Status would be displayed as: <strong>${statusDisplay}</strong></p>`;
                }
                
                html += `</div>`;
                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Test error:', error);
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h4>❌ Test Error</h4>
                        <pre>${error.toString()}</pre>
                    </div>
                `;
            }
        }

        function testPaymentStatusEnum() {
            const resultsDiv = document.getElementById('enum-test-results');
            
            let html = '<div class="result success">';
            html += '<h4>PaymentStatus Enum Values:</h4>';
            html += '<ul>';
            for (const [key, value] of Object.entries(PaymentStatus)) {
                html += `<li>${key}: "${value}" (${typeof value})</li>`;
            }
            html += '</ul>';
            
            // Test different status values
            const testStatuses = ['SUCCESS', 'FAILED', 'PENDING'];
            html += '<h4>Status Processing Test:</h4>';
            html += '<ul>';
            
            testStatuses.forEach(status => {
                const display = getStatusDisplay(status);
                const color = getStatusColor(status);
                html += `<li>"${status}" → Display: ${display}, Color: ${color}</li>`;
            });
            
            html += '</ul></div>';
            resultsDiv.innerHTML = html;
        }

        // Simulate the status processing logic from the React component
        function getStatusDisplay(status) {
            switch (status) {
                case PaymentStatus.SUCCESS:
                    return 'Payment Successful!';
                case PaymentStatus.FAILED:
                    return 'Payment Failed';
                case PaymentStatus.PENDING:
                    return 'Payment Pending';
                default:
                    return 'Payment Status Unknown';
            }
        }

        function getStatusColor(status) {
            switch (status) {
                case PaymentStatus.SUCCESS:
                    return 'from-green-400 to-green-600';
                case PaymentStatus.FAILED:
                    return 'from-red-400 to-red-600';
                case PaymentStatus.PENDING:
                    return 'from-yellow-400 to-yellow-600';
                default:
                    return 'from-orange-400 to-orange-600';
            }
        }
    </script>
</body>
</html>
